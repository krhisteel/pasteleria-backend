# Levanta MySQL + backend con un solo comando: docker compose up --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"   # root sin contraseña, igual que XAMPP
      MYSQL_DATABASE: pasteleria_db
    ports:
      - "3307:3306"   # 3307 para no chocar con el MySQL de XAMPP (3306)
    volumes:
      - datos-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Dentro de Docker la base se llama "db" (el nombre del servicio), no localhost.
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/pasteleria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      DB_USER: root
      DB_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos-mysql:
