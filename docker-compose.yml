# Alternativa existente de ejecucion; no es necesaria para usar MariaDB externa.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD fuera del repositorio}
      MYSQL_DATABASE: ${DB_NAME:?Defina DB_NAME}
      MYSQL_USER: ${DB_USER:?Defina un DB_USER distinto de root}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD fuera del repositorio}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - datos-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:?Defina DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      DB_USER: ${DB_USER:?Defina DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET fuera del repositorio}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_VENDEDOR_PASSWORD: ${DEMO_VENDEDOR_PASSWORD:-}
      DEMO_CLIENTE_PASSWORD: ${DEMO_CLIENTE_PASSWORD:-}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos-mysql:
