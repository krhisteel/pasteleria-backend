spring.application.name=pasteleria

# --- MySQL de XAMPP (usuario root sin contraseña) ---
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- JWT ---
jwt.secret=${JWT_SECRET:cGFzdGVsZXJpYS0xMDAwLXNhYm9yZXMtY2xhdmUtc2VjcmV0YS1qd3QtMjAyNi1kdW9j}
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=604800000

# --- CORS (frontend Vite) ---
app.cors.origins=http://localhost:5173

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html