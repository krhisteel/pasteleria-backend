spring.application.name=pasteleria

# Conexion explicita; nunca crear una base automaticamente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.sql.init.mode=never

# JWT_SECRET debe ser Base64 de al menos 32 bytes aleatorios, sin respaldo publico.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=604800000

# Solo se necesitan al crear una cuenta demo que no existe.
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo.vendedor-password=${DEMO_VENDEDOR_PASSWORD:}
app.demo.cliente-password=${DEMO_CLIENTE_PASSWORD:}

app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173}
springdoc.swagger-ui.path=/swagger-ui.html
